<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021B35"/>
      <stop offset="50%" stop-color="#05284C"/>
      <stop offset="100%" stop-color="#001428"/>
    </linearGradient>

    <!-- Saffron Gradient -->
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9933"/>
      <stop offset="50%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#D94800"/>
    </linearGradient>

    <!-- Green Gradient -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12B852"/>
      <stop offset="50%" stop-color="#0D8A3C"/>
      <stop offset="100%" stop-color="#065924"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="100%" stop-color="#F77F00"/>
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Ring with Subtle Tech Dash -->
  <circle cx="100" cy="100" r="94" fill="url(#bgGrad)" stroke="#1E4D7A" stroke-width="2" filter="url(#dropShadow)"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.75" stroke-dasharray="8 4"/>

  <!-- Tech Circuit Rings -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="#2563EB" stroke-width="1" stroke-opacity="0.3"/>
  
  <!-- Circuit Nodes on Orbit -->
  <circle cx="100" cy="18" r="3.5" fill="#FF9933"/>
  <circle cx="182" cy="100" r="3.5" fill="#12B852"/>
  <circle cx="100" cy="182" r="3.5" fill="#FFD166"/>
  <circle cx="18" cy="100" r="3.5" fill="#38BDF8"/>

  <!-- Dynamic Swirling Tricolor Wings (Saffron & Green) -->
  <!-- Top Saffron Wing -->
  <path d="M 100 22 
           C 146 22 176 54 174 96 
           C 172 80 152 46 116 44 
           C 82 42 62 68 54 88 
           C 60 60 76 22 100 22 Z" 
        fill="url(#saffronGrad)" filter="url(#subtleGlow)"/>

  <!-- Bottom Green Wing -->
  <path d="M 100 178 
           C 54 178 24 146 26 104 
           C 28 120 48 154 84 156 
           C 118 158 138 132 146 112 
           C 140 140 124 178 100 178 Z" 
        fill="url(#greenGrad)" filter="url(#subtleGlow)"/>

  <!-- Center White Clean Aura -->
  <circle cx="100" cy="100" r="48" fill="#FFFFFF" filter="url(#dropShadow)"/>
  <circle cx="100" cy="100" r="45" fill="#F8FAFC" stroke="#002B49" stroke-width="2"/>

  <!-- Ashoka Chakra Wheel (Navy Blue #002B49) -->
  <circle cx="100" cy="100" r="36" fill="none" stroke="#002B49" stroke-width="3"/>
  <circle cx="100" cy="100" r="33" fill="none" stroke="#1D4ED8" stroke-width="0.8"/>

  <!-- 24 Radial Spokes -->
  <g stroke="#002B49" stroke-width="1.8" stroke-linecap="round">
    <line x1="100" y1="67" x2="100" y2="133"/>
    <line x1="67" y1="100" x2="133" y2="100"/>
    <line x1="76.7" y1="76.7" x2="123.3" y2="123.3"/>
    <line x1="76.7" y1="123.3" x2="123.3" y2="76.7"/>
    <line x1="100" y1="100" x2="131.9" y2="91.5"/>
    <line x1="100" y1="100" x2="68.1" y2="108.5"/>
    <line x1="100" y1="100" x2="127.7" y2="84.0"/>
    <line x1="100" y1="100" x2="72.3" y2="116.0"/>
    <line x1="100" y1="100" x2="116.0" y2="72.3"/>
    <line x1="100" y1="100" x2="84.0" y2="127.7"/>
    <line x1="100" y1="100" x2="108.5" y2="68.1"/>
    <line x1="100" y1="100" x2="91.5" y2="131.9"/>
    <line x1="100" y1="100" x2="91.5" y2="68.1"/>
    <line x1="100" y1="100" x2="108.5" y2="131.9"/>
    <line x1="100" y1="100" x2="84.0" y2="72.3"/>
    <line x1="100" y1="100" x2="116.0" y2="127.7"/>
    <line x1="100" y1="100" x2="72.3" y2="84.0"/>
    <line x1="100" y1="100" x2="127.7" y2="116.0"/>
    <line x1="100" y1="100" x2="68.1" y2="91.5"/>
    <line x1="100" y1="100" x2="131.9" y2="108.5"/>
  </g>

  <!-- Inner Center Hub & Connected Tech Core -->
  <circle cx="100" cy="100" r="10" fill="#002B49"/>
  <circle cx="100" cy="100" r="5" fill="#FF9933"/>
  <circle cx="100" cy="100" r="2" fill="#FFFFFF"/>

  <!-- Satellite network nodes -->
  <circle cx="100" cy="65" r="3" fill="#FF9933"/>
  <circle cx="135" cy="100" r="3" fill="#0D8A3C"/>
  <circle cx="100" cy="135" r="3" fill="#12B852"/>
  <circle cx="65" cy="100" r="3" fill="#FF9933"/>
</svg>
