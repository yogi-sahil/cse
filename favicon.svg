  <path d="M 8 16 Q 24 8 40 16" stroke="url(#flagSaffron)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M 8 24 Q 24 18 40 24" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 8 32 Q 24 28 40 32" stroke="url(#flagGreen)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- Central CSC Digital Core -->
  <circle cx="24" cy="24" r="5" fill="#FFFFFF"/>
  <circle cx="24" cy="24" r="2.8" fill="#0A3D91"/>
